<section class="min-h-screen bg-cover bg-center"
  style="background-image: url('https://mdbcdn.b-cdn.net/img/Photos/new-templates/search-box/img4.webp');">
  <div class="flex min-h-screen items-center">
    <div class="container">
      <div class="py-8 flex justify-center items-center">
        <div class="w-full md:w-9/12 lg:w-7/12 xl:w-6/12">
          <div class="bg-white shadow-lg" style="border-radius: 15px;">
            <div class="p-6 sm:p-12">
              <h2 class="uppercase text-2xl font-semibold text-center mb-12">Log In</h2>

              <form [formGroup]="form" (submit)="onSubmit()">

                <div class="mb-3">
                  <input type="email"  formControlName="email" id="form3Example3cg" class="w-full rounded-md border border-gray-300 px-4 py-2 text-lg focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="Enter Email" />
                  <app-email-validation [emailControl]="form.get('email')" [isSubmitted]="isSubmitted"></app-email-validation>
                </div>

                <div class="mb-3">
                    <input type="password" formControlName="password" id="form3Example4cg" class="w-full rounded-md border border-gray-300 px-4 py-2 text-lg focus:outline-none focus:ring-2 focus:ring-amber-400" placeholder="Enter Password" />
                    <app-password-validation [passwordControl]="form.get('password')" [isSubmitted]="isSubmitted"></app-password-validation>
                </div>
                  
                <div class="flex justify-center">
                  <button type="submit"
                    class="w-full rounded-md bg-amber-400 hover:bg-amber-500 disabled:opacity-60 px-6 py-2 text-lg font-semibold text-gray-900">Login</button>
                </div>

                <p class="text-center text-gray-500 mt-3 mb-0">Not a member yet? 
                    <a routerLink="/user/register" class="font-bold text-gray-900"><u>Register here</u></a>
                </p>

              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</section>
