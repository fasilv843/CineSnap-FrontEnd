
<div class="bg-slate-950 bg-opacity-40 p-3">
    <div *ngIf="images.length" class="relative p-3" (mouseenter)="setPaused(true)" (mouseleave)="setPaused(false)">
      <div class="relative h-96">
        <div *ngFor="let image of images; index as i"
          class="absolute inset-0 flex justify-center transition-opacity duration-700"
          [class.opacity-0]="i !== activeIndex()"
          [class.pointer-events-none]="i !== activeIndex()"
          [attr.aria-hidden]="i !== activeIndex()">
          <img [src]="image.imageUrl" [alt]="image.title + ' Poster'" class="w-auto max-h-96 rounded-lg" />
          <div class="absolute bottom-5 inset-x-0 text-center">
            <h3 class="text-amber-600 text-stroke-3 text-lg font-semibold">{{ image.title }}</h3>
          </div>
        </div>
      </div>

      <button type="button" (click)="prev()" aria-label="Previous slide"
        class="absolute inset-y-0 left-0 flex w-16 items-center justify-center text-white opacity-60 hover:opacity-100">
        <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
      <button type="button" (click)="next()" aria-label="Next slide"
        class="absolute inset-y-0 right-0 flex w-16 items-center justify-center text-white opacity-60 hover:opacity-100">
        <svg class="w-8 h-8" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    </div>
</div>
