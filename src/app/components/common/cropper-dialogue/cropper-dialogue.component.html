<div class="rounded-lg bg-white p-6 shadow-xl">
    <h1 class="mb-4 text-xl font-semibold text-gray-800">
        Please Crop Your Photo
    </h1>
    <div>
        <image-cropper
        [imageFile]="data.image"
        [maintainAspectRatio]="true"
        [aspectRatio]="1"
        [resizeToHeight]="400"
        [resizeToWidth]="400"
        (imageCropped)="imageCropped($event)"
        >

        </image-cropper>
    </div>
    <div class="mt-4 flex justify-end gap-3">
        <button (click)="activeModal.dismiss('cancel')" class="w-1/3 block rounded-full bg-amber-400 hover:bg-amber-600 hover:shadow-lg font-semibold text-gray-800 px-6 py-2">Cancel</button>
        <button (click)="activeModal.close(result())" class="w-1/3 block rounded-full bg-amber-400 hover:bg-amber-600 hover:shadow-lg font-semibold text-gray-800 px-6 py-2">Done</button>
    </div>
</div>
