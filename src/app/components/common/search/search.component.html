<div class="mx-3 mt-4 flex justify-end pr-10">
  <div class="flex justify-between">
    <div class="mb-3 lg:w-10/12">
      <input type="text" #searchInput class="w-full rounded-md border border-gray-300 px-3 py-1.5 focus:outline-none focus:ring-2 focus:ring-amber-400" (input)="onSearch(searchInput.value)" placeholder="Search Movies Here...">
    </div>

    <div class="lg:w-2/12 mx-2">
      <button class="inline-block rounded-md border px-3 py-1.5 border-transparent bg-amber-500 text-black" (click)="onSearch(searchInput.value)">Search</button>
    </div>
  </div>
</div>
