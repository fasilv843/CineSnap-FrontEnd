@if (isSubmitted && repeatPassControl && repeatPassControl.errors) {
  <div>
    @if (repeatPassControl.errors['required']) {
      <div style="color: red;">Password is required</div>
    }
    @if (repeatPassControl.errors['passwordMismatch']) {
      <div style="color: red;">Passwords do not match</div>
    }
  </div>
}
