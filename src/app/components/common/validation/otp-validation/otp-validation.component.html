@if (otpControl && otpControl.errors) {
  <div>
    @if (otpControl.errors['required']) {
      <div style="color: red;">OTP required</div>
    }
    @if (otpControl.errors['pattern']) {
      <div style="color: red;">OTP has exactly 4 digits</div>
    }
  </div>
}

<div class="text-center font-semibold my-2">
  @if (timerStr !== '00:00') {
    <p>OTP will expire in {{ timerStr }} minutes</p>
  } @else {
    <p>OTP Expired @if (showOTPResend) {
      <span (click)="resendOTP()" class="text-blue-600 cursor-pointer">Resend</span>
    }</p>
  }
</div>
