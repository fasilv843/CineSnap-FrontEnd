<!-- horizontal-scrollable-tabs.component.html -->
<div class="py-3 px-8">
  <h2 class="mb-2 text-lg font-bold text-gray-800">{{ labelTitle }}</h2>
  <div class="relative px-8">
    <div #labelsContainer class="tabs w-full flex gap-3 overflow-x-hidden whitespace-nowrap py-2">
      @for (label of labels; track label) {
        <a class="bg-gray-100 border py-2 px-3 rounded-lg hover:bg-slate-200 transition duration-300 cursor-pointer"
          (click)="onClickLabel(label)">
          {{ label }}
        </a>
      }
    </div>
    @if (showLeftArrow) {
      <button type="button" (click)="scrollLeft()" class="scroll-button left-0" aria-label="Scroll Left">
        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"/>
        </svg>
      </button>
    }
    @if (showRightArrow) {
      <button type="button" (click)="scrollRight()" class="scroll-button right-0" aria-label="Scroll Right">
        <svg class="w-6 h-6" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"/>
        </svg>
      </button>
    }
  </div>
</div>
