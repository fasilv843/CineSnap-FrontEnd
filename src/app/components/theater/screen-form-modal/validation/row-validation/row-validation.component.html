@let control = rowControl();
@if (isSubmitted() && control && control.errors) {
  <div>
    @if (control.errors['required']) {
      <div style="color: red;">Rows are required</div>
    }
    @if (control.errors['pattern']) {
      <div style="color: red;">Row must be a single uppercase char</div>
    }
  </div>
}
