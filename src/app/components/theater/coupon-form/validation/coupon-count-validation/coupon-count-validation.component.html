@if (isSubmitted && couponCountControl && couponCountControl.errors) {
  <div>
    @if (couponCountControl.errors['min']) {
      <div style="color: red;">Coupon Count can't be negative</div>
    }
    @if (couponCountControl.errors['pattern']) {
      <div style="color: red;">Enter a number</div>
    }
  </div>
}
