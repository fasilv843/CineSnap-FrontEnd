@let control = couponCountControl();
@if (isSubmitted() && control && control.errors) {
  <div>
    @if (control.errors['min']) {
      <div style="color: red;">Coupon Count can't be negative</div>
    }
    @if (control.errors['pattern']) {
      <div style="color: red;">Enter a number</div>
    }
  </div>
}
