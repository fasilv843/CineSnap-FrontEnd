
@if (isSubmitted && maxDiscountControl && maxDiscountControl.errors) {
  <div>
    @if (maxDiscountControl.errors['pattern']) {
      <div style="color: red;">Discount must be a number</div>
    }
    @if (maxDiscountControl.errors['min']) {
      <div style="color: red;">Discount Can't be less than 0</div>
    }
    @if (maxDiscountControl.errors['max']) {
      <div style="color: red;">Max discount is 5000</div>
    }
  </div>
}
