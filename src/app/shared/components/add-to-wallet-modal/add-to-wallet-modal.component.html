<form [formGroup]="form" (ngSubmit)="onSubmit()" class="card w-[min(26rem,calc(100vw-2rem))] p-6 shadow-raised">
  <h2 class="font-display text-3xl font-extrabold tracking-tight">Add money to wallet</h2>
  <p class="mt-1 text-sm text-muted">You'll pay securely with Razorpay. The money is added as soon as the payment goes through.</p>

  <label for="wallet-amount" class="mt-5 block text-sm font-semibold">Amount</label>
  <div class="relative mt-1.5">
    <span class="pointer-events-none absolute left-3.5 top-1/2 -translate-y-1/2 text-muted" aria-hidden="true">₹</span>
    <input id="wallet-amount" type="text" inputmode="numeric" class="input pl-8" [formControl]="amount" placeholder="500" autocomplete="off" />
  </div>
  <cs-field-error [control]="amount" [submitted]="submitted()" [messages]="errorMessages" />

  <div class="mt-3 flex gap-2" role="group" aria-label="Quick amounts">
    @for (preset of presets; track preset) {
      <button type="button" csButton variant="secondary" size="sm" class="flex-1" (click)="usePreset(preset)">₹{{ preset }}</button>
    }
  </div>

  <div class="mt-6 flex justify-end gap-2">
    <button type="button" csButton variant="ghost" (click)="onCancel()">Cancel</button>
    <button type="submit" csButton>Continue to payment</button>
  </div>
</form>
