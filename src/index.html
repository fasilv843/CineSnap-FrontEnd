<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>CineSnap</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Apply the saved theme before first paint; ThemeService takes over after boot -->
  <script>
    (function () {
      var theme
      try { theme = localStorage.getItem('theme') } catch (e) {}
      document.documentElement.classList.add(theme === 'dark' ? 'dark' : 'light')
    })()
  </script>

  <link rel="icon" type="image/x-icon" href="./assets/logo-1x1.png">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.11.2/css/all.min.css" rel="stylesheet" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@600;800&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">

</head>
<body>
  <app-root></app-root>

  <!-- Razorpay Script, remove if it is not working  -->
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>
</body>
</html>
